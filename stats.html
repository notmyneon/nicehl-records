    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--white);
      background:
        radial-gradient(circle at 10% 0%, rgba(111,0,31,.42), transparent 34%),
        linear-gradient(155deg, #0a0a0b 0%, #030303 62%, #160006 100%);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button, select { font: inherit; }
    .app { width: min(1500px, calc(100% - 28px)); margin: 18px auto 42px; }

    .site-header {
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 18px 20px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: linear-gradient(130deg, rgba(111,0,31,.96), rgba(8,8,9,.97) 63%);
      box-shadow: var(--shadow);
    }

    .site-header::after,
    .panel::after,
    .summary-card::after {
      content: "";
      position: absolute;
      pointer-events: none;
      background: var(--league-logo-image) center / contain no-repeat;
    }

    .site-header::after {
      width: 310px;
      height: 310px;
      right: -76px;
      top: -112px;
      opacity: .055;
    }

    .brand {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      min-width: 0;
      gap: 15px;
    }

    .league-logo {
      width: 82px;
      height: 82px;
      object-fit: contain;
      flex: 0 0 auto;
      filter: drop-shadow(0 8px 14px rgba(0,0,0,.48));
    }

    .eyebrow, .section-kicker {
      display: block;
      margin: 0 0 3px;
      color: var(--silver);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(29px, 4vw, 54px);
      line-height: .98;
      letter-spacing: -.045em;
    }

    .page-tabs {
      position: relative;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 5px;
      border: 1px solid rgba(191,193,199,.38);
      border-radius: 13px;
      background: rgba(5,5,5,.58);
    }

    .page-tab {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 38px;
      padding: 8px 13px;
      border-radius: 9px;
      color: var(--silver-light);
      font-size: 12px;
      font-weight: 900;
      text-decoration: none;
      white-space: nowrap;
    }

    .page-tab.active { color: var(--white); background: var(--burgundy); }

    .status {
      margin: 14px 0 0;
      padding: 11px 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--silver-light);
      background: rgba(10,10,11,.84);
      font-size: 13px;
    }

    .status.error { color: #ffd3d6; border-color: rgba(255,140,149,.55); }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0,1fr));
      gap: 12px;
      margin-top: 14px;
    }

    .summary-card, .panel {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      border: 1px solid var(--line);
      background: linear-gradient(145deg, rgba(27,27,30,.97), rgba(8,8,9,.97));
      box-shadow: var(--shadow);
    }

    .summary-card {
      min-height: 104px;
      padding: 15px;
      border-radius: 16px;
    }

    .summary-card::after {
      width: 88px;
      height: 88px;
      right: 3px;
      bottom: -12px;
      opacity: .065;
    }

    .summary-card > *, .panel > * { position: relative; z-index: 1; }

    .summary-card span {
      display: block;
      color: var(--silver);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .summary-card strong {
      display: block;
      margin-top: 7px;
      font-size: clamp(28px, 3vw, 41px);
      line-height: 1;
    }

    .panel {
      margin-top: 14px;
      padding: 17px;
      border-radius: 18px;
    }

    .panel::after {
      width: 220px;
      height: 220px;
      right: -44px;
      top: -72px;
      opacity: .035;
    }

    .panel-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 13px;
    }

    .panel-header h2 {
      margin: 3px 0 0;
      font-size: clamp(21px, 2.5vw, 31px);
      line-height: 1.05;
    }

    .control-group {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    label {
      color: var(--silver-light);
      font-size: 12px;
      font-weight: 800;
    }

    select {
      min-width: 160px;
      padding: 9px 10px;
      border: 1px solid var(--silver);
      border-radius: 10px;
      color: var(--white);
      background: var(--black-soft);
      outline: none;
    }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid rgba(191,193,199,.22);
      border-radius: 13px;
      background: rgba(0,0,0,.24);
    }

    table {
      width: 100%;
      min-width: 760px;
      border-collapse: collapse;
      font-variant-numeric: tabular-nums;
    }

    th, td {
      padding: 10px 9px;
      border-bottom: 1px solid rgba(191,193,199,.17);
      text-align: right;
      white-space: nowrap;
    }

    th {
      color: var(--silver-light);
      background: #161619;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    th:first-child, td:first-child,
    th.team-column, td.team-column { text-align: left; }

    tbody tr:hover { background: rgba(111,0,31,.19); }

    .rank-number {
      display: inline-grid;
      width: 29px;
      height: 29px;
      place-items: center;
      border: 1px solid rgba(191,193,199,.42);
      border-radius: 8px;
      color: var(--silver-light);
      background: #0b0b0d;
      font-weight: 900;
    }

    .team-name { color: var(--white); font-weight: 900; }
    .record-value { color: var(--green); font-weight: 950; }

    .actual-value {
      color: var(--silver-light);
      font-weight: 850;
    }

    .adjusted-value {
      color: var(--green);
      font-weight: 950;
    }

    .stage-badge {
      display: inline-flex;
      align-items: center;
      min-height: 27px;
      padding: 4px 8px;
      border: 1px solid rgba(191,193,199,.34);
      border-radius: 8px;
      color: var(--silver-light);
      background: rgba(255,255,255,.035);
      font-size: 11px;
      font-weight: 850;
    }

    .stage-badge.playoff {
      border-color: rgba(111,0,31,.95);
      color: var(--white);
      background: rgba(111,0,31,.29);
    }

    .empty { padding: 22px; color: var(--silver); text-align: center; }

    @media (max-width: 900px) {
      .summary-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
      .site-header { align-items: flex-start; flex-direction: column; }
      .page-tabs { width: 100%; }
      .page-tab { flex: 1; }
      .panel-header { align-items: flex-start; flex-direction: column; }
      .control-group { width: 100%; justify-content: flex-start; }
      select { flex: 1; }
    }

    @media (max-width: 560px) {
      .app { width: calc(100% - 16px); margin-top: 8px; }
      .summary-grid { grid-template-columns: 1fr; }
      .panel { padding: 12px; }
      .control-group { align-items: stretch; flex-direction: column; }
      select { width: 100%; }
    }
  </style>
</head>

Label": "Playoff Final", "isRegularSeason": false, "isPlayoffs": true, "isPlayoffFinal": true}}}}};

    const app = {
      manifest: null,
      scheduleVolume: null,
      periodTypes: null,
      files: [],
      categories: [],
      seasonRows: [],
      weekRows: []
    };

    document.addEventListener("DOMContentLoaded", init);

    async function init() {
      const status = document.getElementById("status");

      try {
        const [manifestResult, scheduleResult, periodResult] = await Promise.allSettled([
          fetchJson("./data/stat-seasons.json"),
          fetchJson("./data/nhl-schedule-volume.json"),
          fetchJson("./data/stat-period-types.json")
        ]);

        app.manifest = manifestResult.status === "fulfilled"
          ? manifestResult.value
          : FALLBACK_MANIFEST;

        app.scheduleVolume = scheduleResult.status === "fulfilled"
          ? scheduleResult.value
          : null;

        app.periodTypes = periodResult.status === "fulfilled"
          ? periodResult.value
          : FALLBACK_PERIOD_TYPES;

        const results = await Promise.allSettled(
          (app.manifest.seasons || []).map(async entry => {
            const file = await fetchJson(`./data/${entry.file}`);
            return { entry, file };
          })
        );

        app.files = results
          .filter(result => result.status === "fulfilled")
          .map(result => result.value);

        if (!app.files.length) {
          throw new Error("No statistical record files could be loaded.");
        }

        buildRecords();
        populateControls();
        attachEvents();
        renderSummary();
        renderRecords();

        const playoffPeriods = new Set(
          app.weekRows
            .filter(row => row.stageKey === "playoffs")
            .map(row => `${row.season}-${row.scoringPeriod}`)
        ).size;

        status.textContent =
          `Loaded ${app.files.length} statistical season${app.files.length === 1 ? "" : "s"}. ` +
          `Season totals use regular-season weeks only. ` +
          `${playoffPeriods} playoff scoring period${playoffPeriods === 1 ? "" : "s"} identified. ` +
          `Choose “Playoff Records” under Record Type to view them.`;
      } catch (error) {
        console.error(error);
        status.classList.add("error");
        status.textContent = error?.message || "Statistical records could not be loaded.";
      }
    }

    async function fetchJson(url) {
      const response = await fetch(url, { cache: "no-store" });
      if (!response.ok) throw new Error(`${url} returned ${response.status}`);
      return response.json();
    }

    function buildRecords() {
      const categoryMap = new Map();
      app.seasonRows = [];
      app.weekRows = [];

      app.files.forEach(({ file }) => {
        (file.categories || []).forEach(category => {
          if (!categoryMap.has(category.id)) categoryMap.set(category.id, category);
        });
      });

      app.files.forEach(({ entry, file }) => {
        const seasonMetadata =
          app.periodTypes?.seasons?.[entry.id] || {};

        const regularPeriods = new Set(
          (seasonMetadata.regularSeasonPeriods || []).map(Number)
        );

        (file.weeks || []).forEach(week => {
          const scoringPeriod = Number(week.scoringPeriod);
          const periodMetadata =
            seasonMetadata?.periods?.[String(scoringPeriod)] || null;

          const regularSeason = periodMetadata
            ? periodMetadata.stageKey === "regular"
            : regularPeriods.has(scoringPeriod);

          const stageKey = regularSeason ? "regular" : "playoffs";
          const stageLabel = periodMetadata?.stageLabel || (
            regularSeason ? "Regular Season" : "Playoffs"
          );

          const resolvedDateRange =
            week.dateRange ||
            periodMetadata?.label ||
            "";

          const scheduleMetrics = getScheduleMetrics(
            entry.id,
            scoringPeriod,
            resolvedDateRange,
            periodMetadata
          );

          (week.teams || []).forEach(team => {
            app.weekRows.push({
              season: entry.id,
              seasonLabel: entry.label || entry.id,
              scoringPeriod,
              dateRange: resolvedDateRange,
              teamId: team.teamId,
              teamName: team.teamName,
              stats: team.stats || {},
              stageKey,
              stageLabel,
              isPlayoffFinal: Boolean(periodMetadata?.isPlayoffFinal),
              ...scheduleMetrics
            });
          });
        });
      });

      // Season records deliberately exclude all playoff periods.
      const seasonMap = new Map();

      app.weekRows
        .filter(row => row.stageKey === "regular")
        .forEach(row => {
          const key = `${row.season}::${row.teamId}`;

          if (!seasonMap.has(key)) {
            seasonMap.set(key, {
              season: row.season,
              seasonLabel: row.seasonLabel,
              teamId: row.teamId,
              teamName: row.teamName,
              stats: {}
            });
          }

          const seasonRow = seasonMap.get(key);
          seasonRow.teamName = row.teamName;

          Object.entries(row.stats || {}).forEach(([categoryId, value]) => {
            seasonRow.stats[categoryId] =
              Number(seasonRow.stats[categoryId] || 0) +
              Number(value || 0);
          });
        });

      app.seasonRows = Array.from(seasonMap.values());
      app.categories = Array.from(categoryMap.values());
    }

    function getScheduleMetrics(
      season,
      scoringPeriod,
      dateRange,
      periodMetadata
    ) {
      const seasonSchedule =
        app.scheduleVolume?.seasons?.[season] || null;

      const regularPeriod =
        seasonSchedule?.periods?.[String(scoringPeriod)] || null;

      if (regularPeriod) {
        return {
          calendarDays: Number(regularPeriod.calendarDays),
          nhlGames: Number(regularPeriod.nhlGames),
          activeNhlDays: Number(regularPeriod.activeNhlDays),
          inactiveNhlDays: Number(regularPeriod.inactiveNhlDays),
          normalSevenDayGames: Number(
            regularPeriod.normalSevenDayGames ??
            seasonSchedule?.normalSevenDayGames
          )
        };
      }

      let parsedRange = null;

      if (periodMetadata?.startDate && periodMetadata?.endDate) {
        parsedRange = {
          start: new Date(`${periodMetadata.startDate}T00:00:00Z`),
          end: new Date(`${periodMetadata.endDate}T00:00:00Z`)
        };
      } else {
        parsedRange = parseFantraxDateRange(dateRange);
      }

      const dailyCounts = seasonSchedule?.dailyGameCounts || {};
      const normalSevenDayGames =
        Number(seasonSchedule?.normalSevenDayGames);

      if (!parsedRange) {
        return {
          calendarDays: null,
          nhlGames: null,
          activeNhlDays: null,
          inactiveNhlDays: null,
          normalSevenDayGames
        };
      }

      let nhlGames = 0;
      let activeNhlDays = 0;
      let cursor = new Date(parsedRange.start.getTime());

      while (cursor <= parsedRange.end) {
        const dateKey = isoDate(cursor);
        const games = Number(dailyCounts[dateKey] || 0);

        nhlGames += games;
        if (games > 0) activeNhlDays += 1;

        cursor.setUTCDate(cursor.getUTCDate() + 1);
      }

      const calendarDays =
        Math.round(
          (parsedRange.end.getTime() -
           parsedRange.start.getTime()) / 86400000
        ) + 1;

      return {
        calendarDays,
        nhlGames,
        activeNhlDays,
        inactiveNhlDays: calendarDays - activeNhlDays,
        normalSevenDayGames
      };
    }

    function parseFantraxDateRange(value) {
      const cleaned = String(value || "")
        .trim()
        .replace(/^\(|\)$/g, "");

      const parts = cleaned.split(/\s+-\s+/);
      if (parts.length !== 2) return null;

      const start = parseFantraxDate(parts[0]);
      const end = parseFantraxDate(parts[1]);

      return start && end ? { start, end } : null;
    }

    function parseFantraxDate(value) {
      const cleaned = String(value || "")
        .replace(/^[A-Za-z]{3}\s+/, "")
        .trim();

      const match = cleaned.match(
        /^([A-Za-z]{3})\s+(\d{1,2}),\s+(\d{4})$/
      );

      if (!match) return null;

      const months = {
        Jan: 0, Feb: 1, Mar: 2, Apr: 3,
        May: 4, Jun: 5, Jul: 6, Aug: 7,
        Sep: 8, Oct: 9, Nov: 10, Dec: 11
      };

      const month = months[match[1]];
      if (!Number.isInteger(month)) return null;

      return new Date(Date.UTC(
        Number(match[3]),
        month,
        Number(match[2])
      ));
    }

    function isoDate(date) {
      return [
        date.getUTCFullYear(),
        String(date.getUTCMonth() + 1).padStart(2, "0"),
        String(date.getUTCDate()).padStart(2, "0")
      ].join("-");
    }

    function populateControls() {
      const groups = Array.from(
        new Map(app.categories.map(category => [category.group, category.groupLabel])).entries()
      );

      document.getElementById("groupSelect").innerHTML = groups
        .map(([value, label]) => `<option value="${escapeHtml(value)}">${escapeHtml(label)}</option>`)
        .join("");

      const seasons = app.files
        .map(({ entry }) => entry)
        .sort((a, b) => String(b.id).localeCompare(String(a.id)));

      document.getElementById("seasonFilter").innerHTML =
        `<option value="all">All Seasons</option>` +
        seasons.map(entry =>
          `<option value="${escapeHtml(entry.id)}">${escapeHtml(entry.label || entry.id)}</option>`
        ).join("");

      populateStats();
      updateScopeControls();
    }

    function populateStats() {
      const group = document.getElementById("groupSelect").value;
      const select = document.getElementById("statSelect");
      const previous = select.value;

      const categories = app.categories
        .filter(category => category.group === group)
        .sort((a, b) => a.name.localeCompare(b.name));

      select.innerHTML = categories
        .map(category =>
          `<option value="${escapeHtml(category.id)}">${escapeHtml(category.name)} (${escapeHtml(category.shortName)})</option>`
        )
        .join("");

      if (categories.some(category => category.id === previous)) {
        select.value = previous;
      } else {
        const preferred =
          categories.find(category => category.shortName === "G") ||
          categories[0];
        if (preferred) select.value = preferred.id;
      }
    }

    function attachEvents() {
      document.getElementById("scopeSelect").addEventListener("change", () => {
        const scope = document.getElementById("scopeSelect").value;

        if (scope === "playoffs") {
          document.getElementById("weekModeSelect").value = "adjusted";
        }

        updateScopeControls();
        renderRecords();
      });
      document.getElementById("groupSelect").addEventListener("change", () => {
        populateStats();
        renderRecords();
      });
      document.getElementById("statSelect").addEventListener("change", renderRecords);
      document.getElementById("seasonFilter").addEventListener("change", renderRecords);
      document.getElementById("weekModeSelect").addEventListener("change", renderRecords);
    }

    function updateScopeControls() {
      const scope = document.getElementById("scopeSelect").value;
      const regularWeekly = scope === "week";
      const playoffs = scope === "playoffs";

      document.getElementById("weekModeSelect").disabled =
        scope === "season" || playoffs;

      document.getElementById("weekModeLabel").style.opacity =
        regularWeekly ? "1" : ".5";

      if (playoffs) {
        document.getElementById("weekModeSelect").value = "adjusted";
      }
    }

    function renderSummary() {
      document.getElementById("seasonCount").textContent = app.files.length;
      document.getElementById("categoryCount").textContent = app.categories.length;
      document.getElementById("teamSeasonCount").textContent =
        app.seasonRows.length.toLocaleString("en-CA");
      document.getElementById("teamWeekCount").textContent =
        app.weekRows.length.toLocaleString("en-CA");
    }

    function renderRecords() {
      const scope = document.getElementById("scopeSelect").value;
      const categoryId = document.getElementById("statSelect").value;
      const seasonFilter = document.getElementById("seasonFilter").value;
      const weekMode = document.getElementById("weekModeSelect").value;

      if (scope === "season") {
        renderSeasonRecords(categoryId, seasonFilter);
      } else if (scope === "playoffs") {
        renderWeeklyRecords(
          categoryId,
          seasonFilter,
          "adjusted",
          "playoffs"
        );
      } else {
        renderWeeklyRecords(
          categoryId,
          seasonFilter,
          weekMode,
          "regular"
        );
      }
    }

    function renderSeasonRecords(categoryId, seasonFilter) {
      const rows = app.seasonRows
        .filter(row => seasonFilter === "all" || row.season === seasonFilter)
        .map(row => ({ ...row, value: Number(row.stats[categoryId] || 0) }))
        .sort((a, b) =>
          b.value - a.value ||
          String(b.season).localeCompare(String(a.season)) ||
          a.teamName.localeCompare(b.teamName)
        )
        .slice(0, 10);

      document.getElementById("recordsHead").innerHTML = `
        <tr>
          <th>Rank</th>
          <th class="team-column">Team</th>
          <th>Value</th>
          <th>Season</th>
        </tr>
      `;

      document.getElementById("recordsBody").innerHTML = rows.length
        ? rows.map((row, index) => `
            <tr>
              <td><span class="rank-number">${index + 1}</span></td>
              <td class="team-column"><span class="team-name">${escapeHtml(row.teamName)}</span></td>
              <td class="record-value">${formatNumber(row.value)}</td>
              <td>${escapeHtml(row.seasonLabel)}</td>
            </tr>
          `).join("")
        : `<tr><td colspan="4" class="empty">No season records are available.</td></tr>`;
    }

    function renderWeeklyRecords(
      categoryId,
      seasonFilter,
      weekMode,
      stageFilter
    ) {
      let rows = app.weekRows
        .filter(row =>
          seasonFilter === "all" ||
          row.season === seasonFilter
        )
        .filter(row => row.stageKey === stageFilter);

      if (weekMode === "short") {
        rows = rows.filter(row => row.calendarDays < 7);
      } else if (weekMode === "standard") {
        rows = rows.filter(row => row.calendarDays === 7);
      } else if (weekMode === "long") {
        rows = rows.filter(row => row.calendarDays > 7);
      }

      const rankByAdjusted =
        weekMode === "adjusted" ||
        stageFilter === "playoffs";

      rows = rows
        .map(row => {
          const actualValue =
            Number(row.stats[categoryId] || 0);

          const canAdjust =
            Number.isFinite(row.nhlGames) &&
            row.nhlGames > 0 &&
            Number.isFinite(row.normalSevenDayGames) &&
            row.normalSevenDayGames > 0;

          const adjustedValue = canAdjust
            ? actualValue *
              row.normalSevenDayGames /
              row.nhlGames
            : null;

          const rankingValue =
            rankByAdjusted &&
            Number.isFinite(adjustedValue)
              ? adjustedValue
              : actualValue;

          return {
            ...row,
            actualValue,
            adjustedValue,
            canAdjust,
            rankingValue
          };
        })
        .filter(row => !rankByAdjusted || row.canAdjust)
        .sort((a, b) =>
          b.rankingValue - a.rankingValue ||
          b.actualValue - a.actualValue ||
          String(b.season).localeCompare(String(a.season)) ||
          b.scoringPeriod - a.scoringPeriod ||
          a.teamName.localeCompare(b.teamName)
        )
        .slice(0, 10);

      document.getElementById("recordsHead").innerHTML = `
        <tr>
          <th>Rank</th>
          <th class="team-column">Team</th>
          <th>Actual</th>
          <th>Adjusted 7-Day</th>
          <th>Season</th>
          <th>Week</th>
          <th>Stage</th>
          <th>NHL Schedule</th>
        </tr>
      `;

      document.getElementById("recordsBody").innerHTML =
        rows.length
          ? rows.map((row, index) => `
              <tr>
                <td>
                  <span class="rank-number">${index + 1}</span>
                </td>
                <td class="team-column">
                  <span class="team-name">
                    ${escapeHtml(row.teamName)}
                  </span>
                </td>
                <td class="actual-value">
                  ${formatNumber(row.actualValue)}
                </td>
                <td class="adjusted-value">
                  ${Number.isFinite(row.adjustedValue)
                    ? formatNumber(row.adjustedValue, 1)
                    : "—"}
                </td>
                <td>${escapeHtml(row.seasonLabel)}</td>
                <td>${row.scoringPeriod}</td>
                <td>${stageLabel(row)}</td>
                <td>${scheduleLabel(row)}</td>
              </tr>
            `).join("")
          : `<tr><td colspan="8" class="empty">${
              stageFilter === "playoffs"
                ? "No playoff statistical periods were found in the loaded season files."
                : "No regular-season weekly records are available for this filter."
            }</td></tr>`;
    }

    function stageLabel(row) {
      const duration =
        Number.isFinite(row.calendarDays) &&
        row.calendarDays > 7
          ? ` · ${row.calendarDays} days`
          : "";

      const playoffClass =
        row.stageKey === "playoffs"
          ? " playoff"
          : "";

      return (
        `<span class="stage-badge${playoffClass}">` +
        `${escapeHtml(row.stageLabel)}${duration}` +
        `</span>`
      );
    }

    function scheduleLabel(row) {
      if (!Number.isFinite(row.nhlGames) || row.nhlGames <= 0) {
        return escapeHtml(row.dateRange || "—");
      }

      return `${row.nhlGames} games · ${row.activeNhlDays} active days`;
    }

    function formatNumber(value, decimals = 0) {
      return Number(value || 0).toLocaleString("en-CA", {
        minimumFractionDigits: decimals,
        maximumFractionDigits: decimals
      });
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
